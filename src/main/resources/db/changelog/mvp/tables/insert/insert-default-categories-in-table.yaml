databaseChangeLog:
  - changeSet:
      id: insert-default-categories
      author: system
      changes:
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: "Чоловіче"
              - column:
                  name: key
                  value: "mens"
              - column:
                  name: description
                  value: "Стильний чоловічий одяг та аксесуари для будь-якої нагоди. Від класичних костюмів до повсякденних футболок — знайдіть свій ідеальний образ!"
              - column:
                  name: is_quickly_accessible
                  value: "true"
              - column:
                  name: is_removable
                  value: "false"
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: "Жіноче"
              - column:
                  name: key
                  value: "womens"
