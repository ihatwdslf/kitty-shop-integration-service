                  value: "Жіноча мода, що підкреслює вашу красу. Від елегантних суконь до сучасних трендів — створіть свій унікальний стиль!"
              - column:
                  name: is_quickly_accessible
                  value: "true"
              - column:
                  name: is_removable
                  value: "false"
