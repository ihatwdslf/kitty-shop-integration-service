databaseChangeLog:
  - changeSet:
      id: create-user-roles-table
      author: system
      changes:
        # Roles table
        - createTable:
            tableName: roles
            schemaName: public
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true