databaseChangeLog:
  - changeSet:
      id: create-categories-table
      author: system
      changes:
        # Categories table
        - createTable:
            tableName: categories
            schemaName: public
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: icon
                  type: VARCHAR(32)
                  constraints:
                    nullable: true    
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: is_removable
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValue: "true"
        - addForeignKeyConstraint:
            baseTableName: categories
            baseTableSchemaName: public
            baseColumnNames: parent_id
            constraintName: categories_parent_id_fkey
            referencedTableName: categories
            referencedTableSchemaName: public
            referencedColumnNames: id
            onDelete: SET NULL