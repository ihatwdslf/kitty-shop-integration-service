databaseChangeLog:
  - changeSet:
      id: create-orders-table
      author: system
      changes:
        # Orders table
        - createTable:
            tableName: orders
            schemaName: public
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_date
                  type: TIMESTAMP
              - column:
                  name: shipping_address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: orders
            baseTableSchemaName: public
            baseColumnNames: user_id
            constraintName: orders_user_id_fkey
            referencedTableName: users
            referencedTableSchemaName: public
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: orders
            baseTableSchemaName: public
            baseColumnNames: status_id
            constraintName: orders_status_id_fkey
            referencedTableName: statuses
            referencedTableSchemaName: public
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: orders
            baseTableSchemaName: public
            baseColumnNames: payment_method_id
            constraintName: orders_payment_method_id_fkey
            referencedTableName: payment_methods
            referencedTableSchemaName: public
            referencedColumnNames: id
            onDelete: CASCADE